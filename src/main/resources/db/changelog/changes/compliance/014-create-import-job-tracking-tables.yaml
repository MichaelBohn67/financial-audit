databaseChangeLog:
  - changeSet:
      id: 014-1-create-import-jobs-table
      author: junie
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: import_jobs
      changes:
        - createTable:
            tableName: import_jobs
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_import_jobs
              - column:
                  name: source_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: run_context
                  type: VARCHAR(1024)
                  constraints:
                    nullable: false
              - column:
                  name: tenant_id
                  type: VARCHAR(255)
              - column:
                  name: project_id
                  type: VARCHAR(255)
              - column:
                  name: document_id
                  type: VARCHAR(255)
              - column:
                  name: started_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false
              - column:
                  name: finished_at
                  type: DATETIME(6)
              - column:
                  name: record_count
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: imported_count
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: invalid_count
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: checksum
                  type: VARCHAR(255)
              - column:
                  name: error_message
                  type: VARCHAR(1024)

  - changeSet:
      id: 014-2-create-import-job-protocol-entries-table
      author: junie
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: import_job_protocol_entries
      changes:
        - createTable:
            tableName: import_job_protocol_entries
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_import_job_protocol_entries
              - column:
                  name: import_job_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: entry_index
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: level
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: message
                  type: VARCHAR(1024)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: import_job_protocol_entries
            baseColumnNames: import_job_id
            referencedTableName: import_jobs
            referencedColumnNames: id
            constraintName: fk_import_job_protocol_entries_on_import_job
