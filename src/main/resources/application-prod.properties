# Start production with --spring.profiles.active=prod.
server.ssl.enabled=true
server.ssl.key-store=${FINANCIAL_AUDIT_TLS_KEYSTORE}
server.ssl.key-store-password=${FINANCIAL_AUDIT_TLS_KEYSTORE_PASSWORD}
server.ssl.key-store-type=${FINANCIAL_AUDIT_TLS_KEYSTORE_TYPE:PKCS12}
server.ssl.key-alias=${FINANCIAL_AUDIT_TLS_KEY_ALIAS}
server.forward-headers-strategy=framework

server.servlet.session.cookie.secure=true
