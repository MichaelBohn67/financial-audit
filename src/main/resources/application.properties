spring.application.name=financial_audit

server.port=8085
# DataSource settings
spring.datasource.url=jdbc:mariadb://localhost:3306/financial_audit
spring.datasource.driverClassName=org.mariadb.jdbc.Driver
spring.datasource.username=${FINANCIAL_AUDIT_DB_USERNAME:financial_audit}
spring.datasource.password=${FINANCIAL_AUDIT_DB_PASSWORD:change-me}

# JPA settings
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Authentication: provide BCrypt hashes through the deployment secret store.
security.users.auditor.password-hash=${FINANCIAL_AUDIT_AUDITOR_PASSWORD_HASH:$2a$10$N9qo8uLOickgx2ZMRZoMyeIjZAgcfl7p92ldGxad68LJZdL17lhWy}
security.users.lead-auditor.password-hash=${FINANCIAL_AUDIT_LEAD_AUDITOR_PASSWORD_HASH:$2a$10$N9qo8uLOickgx2ZMRZoMyeIjZAgcfl7p92ldGxad68LJZdL17lhWy}
security.users.admin.password-hash=${FINANCIAL_AUDIT_ADMIN_PASSWORD_HASH:$2a$10$N9qo8uLOickgx2ZMRZoMyeIjZAgcfl7p92ldGxad68LJZdL17lhWy}

# Browser session hardening (TLS is enabled by the prod profile).
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Must remain true outside explicitly isolated test configurations.
financial-audit.security.scope-enforcement=true
financial-audit.reporting.archive-directory=${FINANCIAL_AUDIT_REPORT_ARCHIVE_DIRECTORY:./var/report-archive}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.endpoint.health.roles=ADMIN
management.endpoint.health.probes.enabled=true
management.endpoint.info.enabled=true
management.metrics.export.simple.enabled=true
management.metrics.tags.application=${spring.application.name}

# Datenschutz: keine fachlichen Daten in Logs und standardisierte Aufbewahrung.
financial-audit.privacy.data-minimization=true
financial-audit.privacy.audit-retention-period=P7Y
financial-audit.privacy.import-retention-period=P2Y
financial-audit.privacy.archive-retention-period=P10Y
financial-audit.privacy.deletion-requires-approval=true
