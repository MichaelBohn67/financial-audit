databaseChangeLog:
  - changeSet:
      id: 017-1-create-sampling-run-items-table
      author: junie
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: sampling_run_items
      changes:
        - createTable:
            tableName: sampling_run_items
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_sampling_run_items
              - column:
                  name: sampling_run_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: sample_unit_index
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: selection_point
                  type: DECIMAL(19,6)
                  constraints:
                    nullable: false
              - column:
                  name: booking_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: booking_amount
                  type: DECIMAL(19,4)
                  constraints:
                    nullable: false
              - column:
                  name: cumulative_amount
                  type: DECIMAL(19,4)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: sampling_run_items
            baseColumnNames: sampling_run_id
            referencedTableName: sampling_runs
            referencedColumnNames: id
            constraintName: fk_sampling_run_items_on_run
        - addForeignKeyConstraint:
            baseTableName: sampling_run_items
            baseColumnNames: booking_id
            referencedTableName: bookings
            referencedColumnNames: id
            constraintName: fk_sampling_run_items_on_booking
