spring.application.name=financial_audit

server.port=8085
# DataSource settings
spring.datasource.url=jdbc:mariadb://localhost:3306/financial_audit
spring.datasource.driverClassName=org.mariadb.jdbc.Driver
spring.datasource.username=${FINANCIAL_AUDIT_DB_USERNAME}
spring.datasource.password=${FINANCIAL_AUDIT_DB_PASSWORD}

# JPA settings
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Authentication: provide BCrypt hashes through the deployment secret store.
security.users.auditor.password-hash=${FINANCIAL_AUDIT_AUDITOR_PASSWORD_HASH}
security.users.lead-auditor.password-hash=${FINANCIAL_AUDIT_LEAD_AUDITOR_PASSWORD_HASH}
security.users.admin.password-hash=${FINANCIAL_AUDIT_ADMIN_PASSWORD_HASH}

# Browser session hardening (TLS is enabled by the prod profile).
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
