# Isolated pilot profile. All values must be supplied by the deployment secret/config store.
spring.datasource.url=${FINANCIAL_AUDIT_PILOT_DB_URL}
spring.datasource.driverClassName=${FINANCIAL_AUDIT_PILOT_DB_DRIVER:org.mariadb.jdbc.Driver}
spring.datasource.username=${FINANCIAL_AUDIT_DB_USERNAME}
spring.datasource.password=${FINANCIAL_AUDIT_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
financial-audit.security.scope-enforcement=true
financial-audit.reporting.archive-directory=${FINANCIAL_AUDIT_REPORT_ARCHIVE_DIRECTORY:/secure/pilot/archive}
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.endpoint.health.roles=ADMIN
server.shutdown=graceful
